<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realizar Pedido | Panadería Santa Rosa</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link rel="stylesheet" href="css/marca.css">
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous" defer></script>
  <script src="js/pedido.js" defer></script>
</head>
<body style="background-color: #F4F5F7; font-family: 'Helvetica Neue', Arial, sans-serif; color: #1B263B;">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-dark shadow-sm" style="background-color: #1B263B;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index-bootstrap.html">← Volver al Catálogo</a>
    </div>
  </nav>

  <!-- Formulario de Pedidos -->
  <main class="container my-5" style="max-width: 650px;">
    <div class="card p-4 shadow-sm border-0 rounded-4 bg-white">
      <h2 class="mb-4 text-center fw-bold" style="color: #1B263B;">Formulario de Envío y Pago</h2>
      
      <form action="#" novalidate>
        
        <div class="mb-3">
          <label for="nombre" class="form-label fw-bold">Nombre completo:</label>
          <input type="text" id="nombre" class="form-control" required placeholder="Ej. Daniel Díaz">
        </div>

        <div class="mb-3">
          <label for="celular" class="form-label fw-bold">Número de celular:</label>
          <input type="tel" id="celular" class="form-control" required placeholder="Ej. 987654321">
        </div>

        <div class="mb-3">
          <label for="direccion" class="form-label fw-bold">Dirección de entrega:</label>
          <input type="text" id="direccion" class="form-control" required placeholder="Av. Principal 123, Surquillo">
        </div>

        <div class="mb-3">
          <label for="metodo-pago" class="form-label fw-bold">Método de pago:</label>
          <select id="metodo-pago" class="form-select" required>
            <option value="">Seleccionar método de pago</option>
            <option value="yape">Yape / Plin</option>
            <option value="tarjeta">Tarjeta de Débito / Crédito</option>
            <option value="efectivo">Efectivo contra entrega</option>
          </select>
        </div>

        <button type="submit" class="btn w-100 py-2 fw-bold text-white mt-3" style="background-color: #1B263B;">Confirmar y Enviar Pedido</button>
      </form>
      
      <div class="text-center mt-3">
        <a href="index-bootstrap.html" class="text-decoration-none fw-bold" style="color: #C68B59;">← Volver al catálogo</a>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 mt-5" style="color: #415A77; font-weight: 600;">
    <p class="mb-0">Panadería Santa Rosa | Módulo de Pedidos</p>
  </footer>

</body>
</html>
