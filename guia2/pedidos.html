<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos | Panadería Santa Rosa - Guía 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <header>
    <h1 style="margin: 0; font-size: 2rem;">Panadería Santa Rosa</h1>
    <p style="margin: 6px 0 0 0; color: #E0A96D; font-size: 0.95rem;">Formulario de pedidos</p>
  </header>
  
  <main style="max-width: 600px;">
    <h2 style="color: var(--color-primario); text-align: center; margin-top: 0; font-size: 1.6rem;">Realizar un Pedido</h2>
    <p style="text-align: center; color: #555; margin-bottom: 25px;">Completa tus datos para procesar tu solicitud.</p>

    <form action="#" style="display: flex; flex-direction: column; gap: 18px;">
      <div>
        <label for="nombre" style="font-weight: bold; display: block; margin-bottom: 6px; color: var(--color-primario);">Nombre completo:</label>
        <input type="text" id="nombre" style="width: 100%; padding: 12px; border: 1.5px solid #E5DCD0; border-radius: 8px; font-size: 1rem; box-sizing: border-box;" required>
      </div>

      <div>
        <label for="producto" style="font-weight: bold; display: block; margin-bottom: 6px; color: var(--color-primario);">Selecciona el producto:</label>
        <select id="producto" style="width: 100%; padding: 12px; border: 1.5px solid #E5DCD0; border-radius: 8px; font-size: 1rem; background: white; box-sizing: border-box;" required>
          <option value="">-- Seleccionar --</option>
          <option>Pan francés (S/ 0.30)</option>
          <option>Pan de yema (S/ 0.50)</option>
          <option>Chancay (S/ 0.60)</option>
          <option>Torta de chocolate (S/ 45.00)</option>
        </select>
      </div>

      <div>
        <label for="cantidad" style="font-weight: bold; display: block; margin-bottom: 6px; color: var(--color-primario);">Cantidad:</label>
        <input type="number" id="cantidad" min="1" value="1" style="width: 100%; padding: 12px; border: 1.5px solid #E5DCD0; border-radius: 8px; font-size: 1rem; box-sizing: border-box;" required>
      </div>

      <button type="submit" style="background: var(--color-primario); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.05rem; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">Enviar pedido</button>
    </form>

    <div style="text-align: center; margin-top: 30px;">
      <a href="index.html" style="color: var(--color-secundario); font-weight: bold; text-decoration: underline;">Volver al Catálogo</a>
    </div>
  </main>

  <footer>
    <a href="../index.html" style="background: var(--color-primario); color: white; padding: 10px 22px; text-decoration: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; display: inline-block;">Regresar al Menú Principal</a>
  </footer>

</body>
</html>
