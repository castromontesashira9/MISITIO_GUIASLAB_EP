<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos | Guía 3</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <header>
    <h1>Panadería Santa Rosa</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="index.html#productos">Productos</a>
      <a href="pedidos.html" style="background: #C68B59;">Realizar pedido</a>
      <a href="../index.html" style="background: #2D3748;">Menú Principal</a>
    </nav>
  </header>

  <main style="max-width: 650px;">
    <h2 style="text-align: center; margin-top: 0; font-size: 1.8rem;">Formulario de Pedidos</h2>
    <p style="text-align: center; color: #666; margin-bottom: 30px;">Validación de datos mediante JavaScript.</p>

    <form action="#" novalidate>
      <div style="margin-bottom: 20px;">
        <label for="nombre" style="font-weight: bold; display: block; margin-bottom: 8px;">Nombre completo:</label>
        <input type="text" id="nombre" style="width: 100%; padding: 12px; border: 1.5px solid #D1C7BD; border-radius: 8px; font-size: 1rem; box-sizing: border-box;" required>
        <p id="error-nombre" style="color: #C0392B; font-size: 0.88rem; margin: 5px 0 0 0; font-weight: bold;"></p>
      </div>

      <div style="margin-bottom: 20px;">
        <label for="celular" style="font-weight: bold; display: block; margin-bottom: 8px;">Número de celular:</label>
        <input type="tel" id="celular" style="width: 100%; padding: 12px; border: 1.5px solid #D1C7BD; border-radius: 8px; font-size: 1rem; box-sizing: border-box;" required>
        <p id="error-celular" style="color: #C0392B; font-size: 0.88rem; margin: 5px 0 0 0; font-weight: bold;"></p>
      </div>

      <div style="margin-bottom: 20px;">
        <label for="producto" style="font-weight: bold; display: block; margin-bottom: 8px;">Selecciona un producto:</label>
        <select id="producto" style="width: 100%; padding: 12px; border: 1.5px solid #D1C7BD; border-radius: 8px; font-size: 1rem; background: white; box-sizing: border-box;" required>
          <option value="">Seleccionar producto</option>
          <option>Pan francés (S/ 0.30)</option>
          <option>Pan de yema (S/ 0.50)</option>
          <option>Chancay (S/ 0.60)</option>
          <option>Torta de chocolate (S/ 45.00)</option>
        </select>
      </div>

      <div style="margin-bottom: 25px;">
        <label for="cantidad" style="font-weight: bold; display: block; margin-bottom: 8px;">Cantidad:</label>
        <input type="number" id="cantidad" min="1" value="1" style="width: 100%; padding: 12px; border: 1.5px solid #D1C7BD; border-radius: 8px; font-size: 1rem; box-sizing: border-box;" required>
      </div>

      <button type="submit" style="background: #1B263B; color: #FFFFFF; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 12px rgba(27,38,59,0.25);">Validar y Enviar</button>
      
      <div id="estado-envio" style="display: none;"></div>
    </form>
    
    <div style="text-align: center; margin-top: 25px;">
      <a href="index.html" style="color: #C68B59; font-weight: bold; text-decoration: underline;">Volver al inicio</a>
    </div>
  </main>

  <footer>
    <a href="../index.html" class="btn-menu">Regresar al Menú Principal</a>
  </footer>

</body>
</html>
